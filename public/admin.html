<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajay Haircut — Booking Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#1d2547; --navy2:#252e59; --gold:#d99a35; --gold-dark:#8a5f14;
    --ink:#23263b; --muted:#8b8fa3; --line:#e7e3da; --red:#bf443c; --red-line:#eec5c0;
    --bg:#f4f2ed; --card:#ffffff; --chip:#faf8f4;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--ink); padding:18px 14px 40px; }
  .wrap { max-width:680px; margin:0 auto; }

  .head { background:linear-gradient(160deg,var(--navy2),var(--navy)); border-radius:18px; padding:26px 26px 30px; color:#fff; position:relative; box-shadow:0 10px 30px rgba(29,37,71,.18); }
  .eyebrow { color:var(--gold); font-size:12.5px; font-weight:700; letter-spacing:3.5px; margin-bottom:12px; }
  .head h1 { font-size:31px; font-weight:800; letter-spacing:.2px; }
  .head .sub { color:#b9c0d8; font-size:15.5px; margin-top:10px; }
  .logout { position:absolute; top:20px; right:20px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.25); color:#dfe3f2; padding:7px 14px; border-radius:999px; cursor:pointer; font-size:13px; font-weight:600; }
  .logout:hover { border-color:var(--gold); color:var(--gold); }

  .card { background:var(--card); border-radius:18px; margin-top:16px; padding:22px 20px 26px; box-shadow:0 4px 18px rgba(35,38,59,.05); }

  .login-body label { display:block; margin:4px 0 7px; font-size:12.5px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--muted); }
  .login-body input { width:100%; padding:13px 14px; border-radius:11px; border:1px solid var(--line); font-size:16px; color:var(--ink); }
  .login-body input:focus { outline:none; border-color:var(--gold); }
  .btn-navy { background:var(--navy); color:#fff; border:none; padding:13px 22px; border-radius:12px; font-weight:700; font-size:15px; cursor:pointer; }
  .btn-navy:hover { background:var(--navy2); }
  .err { color:var(--red); margin-top:12px; font-size:14px; min-height:18px; }

  .monthnav { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .monthnav h2 { font-size:20px; font-weight:800; color:var(--navy); }
  .navbtn { width:42px; height:42px; border-radius:11px; border:1px solid var(--line); background:#fff; font-size:17px; color:var(--navy); cursor:pointer; font-weight:700; }
  .navbtn:hover { border-color:var(--gold); }
  .week { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; color:#a2a6b5; font-size:13px; font-weight:600; padding:4px 0 8px; }
  .grid { display:grid; grid-template-columns:repeat(7,1fr); gap:7px; }
  .day { border:1px solid var(--line); border-radius:12px; min-height:66px; padding:6px 2px 7px; display:flex; flex-direction:column; align-items:center; cursor:pointer; background:#fff; }
  .day:hover { border-color:var(--gold); }
  .day.other { opacity:.32; }
  .day.today { border-color:var(--gold); border-width:2px; }
  .day.sel { background:var(--navy); border-color:var(--navy); }
  .badge { background:var(--gold); color:#23180a; font-size:11.5px; font-weight:800; min-width:24px; height:19px; padding:0 6px; border-radius:999px; display:flex; align-items:center; justify-content:center; margin-bottom:3px; }
  .badge.zero { visibility:hidden; }
  .dnum { font-size:16.5px; font-weight:800; color:var(--navy); line-height:1.1; }
  .day.sel .dnum { color:#fff; }
  .dlabel { font-size:10.5px; color:var(--red); margin-top:2px; font-weight:600; }

  .dayhead { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-top:26px; flex-wrap:wrap; }
  .dayhead h2 { font-size:25px; font-weight:800; color:var(--navy); line-height:1.15; }
  .dayhead .count { color:var(--muted); font-size:14px; margin-top:7px; }
  .daybtns { display:flex; gap:10px; }
  .btn-block { background:#fff; color:var(--red); border:1px solid var(--red-line); padding:12px 16px; border-radius:12px; font-weight:700; font-size:14.5px; cursor:pointer; line-height:1.25; }
  .btn-block:hover { background:#fdf1f0; }
  .btn-add { background:var(--navy); color:#fff; border:none; padding:12px 18px; border-radius:12px; font-weight:700; font-size:14.5px; cursor:pointer; line-height:1.25; }
  .btn-add:hover { background:var(--navy2); }

  .tablewrap { overflow-x:auto; margin-top:14px; }
  table { width:100%; border-collapse:collapse; min-width:560px; }
  th { text-align:left; font-size:11px; letter-spacing:1.4px; color:#a2a6b5; text-transform:uppercase; padding:10px 8px; border-bottom:1px solid #efede8; font-weight:700; }
  td { padding:14px 8px; border-bottom:1px solid #f1efe9; font-size:15px; color:var(--navy); vertical-align:top; }
  .ttime { font-weight:800; font-size:15.5px; white-space:nowrap; }
  .tdur { color:var(--muted); font-size:12.5px; margin-top:3px; }
  .tnote { color:var(--muted); font-size:12.5px; margin-top:3px; max-width:170px; }
  .editbtn { background:none; border:none; color:var(--navy); font-weight:700; font-size:14.5px; cursor:pointer; padding:2px 4px; }
  .editbtn:hover { color:var(--gold-dark); }
  tr.cancelled td { color:var(--muted); text-decoration:line-through; }
  tr.cancelled td .tdur, tr.cancelled td .tnote { text-decoration:none; }
  .tag { font-size:11px; font-weight:700; color:var(--red); text-decoration:none; display:inline-block; margin-top:3px; }
  .empty { color:var(--muted); font-size:14.5px; padding:18px 8px; }

  /* Modal */
  .overlay { position:fixed; inset:0; background:rgba(20,24,45,.55); display:none; align-items:flex-start; justify-content:center; padding:26px 14px; z-index:50; overflow-y:auto; }
  .overlay.open { display:flex; }
  .modal { background:#fff; border-radius:16px; width:100%; max-width:460px; padding:24px 22px; }
  .modal h3 { font-size:21px; font-weight:800; color:var(--navy); margin-bottom:18px; }
  .modal label.flabel { display:block; margin:16px 0 7px; font-size:12.5px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--muted); }
  .modal input[type=text], .modal input[type=tel], .modal input[type=date], .modal select, .modal textarea { width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); font-size:15.5px; color:var(--ink); background:#fff; font-family:inherit; }
  .modal textarea { min-height:64px; resize:vertical; }
  .modal input:focus, .modal select:focus, .modal textarea:focus { outline:none; border-color:var(--gold); }
  .modal input:disabled, .modal textarea:disabled { background:#f3f1ec; color:#a9acba; }
  .blockrow { display:flex; align-items:center; gap:11px; cursor:pointer; margin-bottom:4px; }
  .blockrow input { width:21px; height:21px; accent-color:var(--navy); cursor:pointer; }
  .blockrow span { font-size:15.5px; font-weight:700; color:var(--navy); }
  .chips { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; }
  .chip { background:var(--chip); border:1px solid var(--line); border-radius:9px; padding:10px 2px; text-align:center; font-size:13.5px; font-weight:600; color:var(--navy); cursor:pointer; }
  .chip:hover { border-color:var(--gold); }
  .chip.sel { background:var(--navy); color:#fff; border-color:var(--navy); }
  .chip.off { color:#b9bcc9; text-decoration:line-through; cursor:default; background:#f6f4ef; }
  .chip.off:hover { border-color:var(--line); }
  .modal .row { display:flex; gap:10px; margin-top:22px; flex-wrap:wrap; }
  .btn-ghost { background:#fff; border:1px solid var(--line); color:var(--ink); padding:12px 18px; border-radius:11px; font-weight:600; font-size:14.5px; cursor:pointer; }
  .btn-danger { background:#fff; border:1px solid var(--red-line); color:var(--red); padding:12px 18px; border-radius:11px; font-weight:700; font-size:14.5px; cursor:pointer; }
  td.acts { white-space:nowrap; }
  .actbtn { background:none; border:none; font:inherit; font-weight:700; font-size:14.5px; cursor:pointer; padding:4px 5px; }
  .actbtn.edit, .actbtn.complete { color:var(--navy); }
  .actbtn.cancel { color:var(--red); }
  tr.completed td { color:var(--muted); }
  tr.completed td .tdur, tr.completed td .tnote { color:var(--muted); }
  .sectoggle { background:none; border:none; font:inherit; font-weight:600; font-size:14.5px; color:var(--navy); cursor:pointer; padding:12px 2px 2px; display:block; }
  .sectable { width:100%; border-collapse:collapse; }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div class="eyebrow">OWNER ACCESS</div>
    <h1>Booking Dashboard</h1>
    <div class="sub">Ajay Haircut · Surrey, BC</div>
    <button class="logout" id="logoutBtn" style="display:none;">Log out</button>
  </div>

  <div class="card login-body" id="loginView">
    <label for="pw">Password</label>
    <input type="password" id="pw" autocomplete="current-password" placeholder="Admin password">
    <button class="btn-navy" id="loginBtn" style="width:100%; margin-top:16px;">Log in</button>
    <div class="err" id="loginErr"></div>
  </div>

  <div class="card" id="dashView" style="display:none;">
    <div class="monthnav">
      <button class="navbtn" id="prevBtn">‹</button>
      <h2 id="monthTitle"></h2>
      <button class="navbtn" id="nextBtn">›</button>
    </div>
    <div class="week"><div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div></div>
    <div class="grid" id="calGrid"></div>

    <div class="dayhead">
      <div>
        <h2 id="dayTitle"></h2>
        <div class="count" id="dayCount"></div>
      </div>
      <div class="daybtns">
        <button class="btn-block" id="blockBtn">Block<br>whole day</button>
        <button class="btn-add" id="addBtn">+ Add<br>booking</button>
      </div>
    </div>

    <div class="tablewrap">
      <table>
        <thead><tr><th>Time</th><th>Customer</th><th>Service</th><th>Phone</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="daySections"></div>
  </div>
</div>

<!-- Add / Edit modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">Add booking</h3>
    <label class="blockrow"><input type="checkbox" id="fBlock"><span>Block this time (no customer)</span></label>
    <label class="flabel" for="fService">Service</label>
    <select id="fService"></select>
    <label class="flabel" for="fDate">Date</label>
    <input id="fDate" type="date">
    <label class="flabel">Time</label>
    <div class="chips" id="fChips"></div>
    <label class="flabel" for="fName">Customer name</label>
    <input id="fName" type="text" placeholder="Customer name">
    <label class="flabel" for="fPhone">Phone (optional)</label>
    <input id="fPhone" type="tel" placeholder="Phone number">
    <label class="flabel" for="fNotes">Notes (optional)</label>
    <textarea id="fNotes" placeholder="Notes"></textarea>
    <div class="err" id="formErr"></div>
    <div class="row">
      <button class="btn-navy" id="saveBtn" style="flex:1;">Save booking</button>
      <button class="btn-ghost" id="closeBtn">Close</button>
    </div>
    <div class="row" id="cancelRow" style="display:none;">
      <button class="btn-danger" id="cancelBookingBtn" style="flex:1;">Cancel this booking</button>
    </div>
  </div>
</div>

<script>
  let token = localStorage.getItem('ajayAdminToken') || '';
  let bookings = [], blocked = [], durations = {}, services = [], slots = [];
  let viewY, viewM;
  let selected = '';
  let editingId = null;
  let pickedTime = null;

  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const MON3 = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function key(y, m, d) { return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0'); }
  function todayKey() { const t = new Date(); return key(t.getFullYear(), t.getMonth(), t.getDate()); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function slotMinutes(t) { const m = String(t).match(/^(\d+):(\d+) (AM|PM)$/); if (!m) return 0; let h = parseInt(m[1], 10) % 12; if (m[3] === 'PM') h += 12; return h * 60 + parseInt(m[2], 10); }
  function isTuesday(k) { return new Date(k + 'T12:00:00').getDay() === 2; }
  function activeOn(k) { return bookings.filter(b => b.date === k && b.status === 'booked' && !b.blockedSlot); }

  async function login() {
    const pw = document.getElementById('pw').value;
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw }) });
    const data = await r.json();
    if (!r.ok) { document.getElementById('loginErr').textContent = data.error || 'Login failed.'; return; }
    token = data.token; localStorage.setItem('ajayAdminToken', token);
    showDash();
  }
  function logout() {
    token = ''; localStorage.removeItem('ajayAdminToken');
    document.getElementById('dashView').style.display = 'none';
    document.getElementById('logoutBtn').style.display = 'none';
    document.getElementById('loginView').style.display = 'block';
  }

  async function loadAll() {
    const [r1, r2] = await Promise.all([
      fetch('/api/bookings', { headers: { Authorization: 'Bearer ' + token } }),
      fetch('/api/blocked', { headers: { Authorization: 'Bearer ' + token } }),
    ]);
    if (r1.status === 401) { logout(); return; }
    const d1 = await r1.json(); const d2 = await r2.json();
    bookings = d1.bookings || []; durations = d1.durations || {}; services = d1.services || []; slots = d1.slots || [];
    blocked = d2.blocked || [];
    renderCalendar(); renderDay();
  }

  function renderCalendar() {
    document.getElementById('monthTitle').textContent = MONTHS[viewM] + ' ' + viewY;
    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    const first = new Date(viewY, viewM, 1);
    const start = new Date(viewY, viewM, 1 - first.getDay());
    const tk = todayKey();
    for (let i = 0; i < 42; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i);
      const k = key(d.getFullYear(), d.getMonth(), d.getDate());
      const cell = document.createElement('div');
      cell.className = 'day' + (d.getMonth() !== viewM ? ' other' : '') + (k === selected ? ' sel' : '') + (k === tk ? ' today' : '');
      const n = activeOn(k).length;
      let label = '';
      if (isTuesday(k)) label = 'closed';
      else if (blocked.includes(k)) label = 'blocked';
      cell.innerHTML = '<div class="badge' + (n ? '' : ' zero') + '">' + n + '</div>' +
        '<div class="dnum">' + d.getDate() + '</div>' +
        (label ? '<div class="dlabel">' + label + '</div>' : '');
      cell.onclick = () => { selected = k; viewY = d.getFullYear(); viewM = d.getMonth(); renderCalendar(); renderDay(); };
      grid.appendChild(cell);
    }
  }

  async function setStatus(id, status) {
    const r = await fetch('/api/bookings/' + id + '/status', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: JSON.stringify({ status }) });
    if (r.ok) loadAll();
  }

  function actionCell(b) {
    const td = document.createElement('td');
    td.className = 'acts';
    const mk = (label, cls, fn) => { const btn = document.createElement('button'); btn.className = 'actbtn ' + cls; btn.textContent = label; btn.onclick = fn; td.appendChild(btn); };
    if (b.status === 'booked') {
      mk('Edit', 'edit', () => openModal(b));
      if (!b.blockedSlot) mk('Complete', 'complete', () => setStatus(b.id, 'completed'));
      mk('Cancel', 'cancel', () => { if (confirm('Cancel this booking?')) setStatus(b.id, 'cancelled'); });
    } else {
      mk('Restore', 'edit', () => setStatus(b.id, 'booked'));
    }
    return td;
  }

  function bookingRow(b) {
    const tr = document.createElement('tr');
    if (b.status === 'cancelled') tr.className = 'cancelled';
    if (b.status === 'completed') tr.className = 'completed';
    const dur = durations[b.service] ? '<div class="tdur">' + durations[b.service] + ' min</div>' : '';
    const note = b.notes ? '<div class="tnote">' + esc(b.notes) + '</div>' : '';
    const tag = b.status === 'cancelled' ? '<span class="tag">Cancelled</span>' : b.status === 'completed' ? '<span class="tag">Completed</span>' : '';
    const nameHtml = b.blockedSlot
      ? '<span style="color:var(--red);font-weight:700;">Blocked</span>'
      : esc(b.name) + tag;
    tr.innerHTML = '<td><div class="ttime">' + esc(b.time) + '</div>' + dur + '</td>' +
      '<td>' + nameHtml + note + '</td>' +
      '<td>' + (b.blockedSlot ? '—' : esc(b.service)) + '</td>' +
      '<td>' + esc(b.phone || 'N/A') + '</td>';
    tr.appendChild(actionCell(b));
    return tr;
  }

  function renderDay() {
    const d = new Date(selected + 'T12:00:00');
    document.getElementById('dayTitle').textContent = DAYS[d.getDay()] + ', ' + MON3[d.getMonth()] + ' ' + d.getDate();
    const byTime = (a, b) => slotMinutes(a.time) - slotMinutes(b.time);
    const main = bookings.filter(b => b.date === selected && b.status === 'booked').sort(byTime);
    const completed = bookings.filter(b => b.date === selected && b.status === 'completed').sort(byTime);
    const cancelled = bookings.filter(b => b.date === selected && b.status === 'cancelled').sort(byTime);
    const n = activeOn(selected).length;
    const isBlocked = blocked.includes(selected);
    const tue = isTuesday(selected);
    document.getElementById('dayCount').textContent =
      tue ? 'Closed (Tuesday)' : isBlocked ? 'Blocked — no online bookings' : n + (n === 1 ? ' booking' : ' bookings');
    const blockBtn = document.getElementById('blockBtn');
    blockBtn.style.display = tue ? 'none' : '';
    blockBtn.innerHTML = isBlocked ? 'Unblock<br>day' : 'Block<br>whole day';

    const rows = document.getElementById('rows');
    rows.innerHTML = '';
    if (!main.length) {
      rows.innerHTML = '<tr><td colspan="5" class="empty">No bookings for this day.</td></tr>';
    }
    main.forEach(b => rows.appendChild(bookingRow(b)));

    const sec = document.getElementById('daySections');
    sec.innerHTML = '';
    const addSection = (label, list) => {
      if (!list.length) return;
      const t = document.createElement('button');
      t.className = 'sectoggle'; t.textContent = 'Show ' + label + ' (' + list.length + ')';
      const box = document.createElement('div'); box.style.display = 'none';
      const tbl = document.createElement('table'); tbl.className = 'sectable';
      const tb = document.createElement('tbody');
      list.forEach(b => tb.appendChild(bookingRow(b)));
      tbl.appendChild(tb); box.appendChild(tbl);
      t.onclick = () => { const open = box.style.display !== 'none'; box.style.display = open ? 'none' : ''; t.textContent = (open ? 'Show ' : 'Hide ') + label + ' (' + list.length + ')'; };
      sec.appendChild(t); sec.appendChild(box);
    };
    addSection('completed', completed);
    addSection('cancelled', cancelled);
  }

  document.getElementById('blockBtn').onclick = async () => {
    const isBlocked = blocked.includes(selected);
    const r = isBlocked
      ? await fetch('/api/blocked/' + selected, { method: 'DELETE', headers: { Authorization: 'Bearer ' + token } })
      : await fetch('/api/blocked', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: JSON.stringify({ date: selected }) });
    if (r.ok) { const d = await r.json(); blocked = d.blocked || blocked; renderCalendar(); renderDay(); }
    else alert('Could not update the day. Please try again.');
  };

  // ---------- Add / edit modal ----------
  const overlay = document.getElementById('overlay');
  function buildChips(dateVal, keepTime) {
    pickedTime = null;
    const box = document.getElementById('fChips');
    box.innerHTML = '';
    const takenSet = new Set();
    bookings.filter(b => b.date === dateVal && b.status === 'booked' && b.id !== editingId).forEach(b => {
      const start = slotMinutes(b.time);
      const dur = b.blockedSlot ? 15 : (durations[b.service] || 30);
      slots.forEach(t => { const m = slotMinutes(t); if (m >= start && m < start + dur) takenSet.add(t); });
    });
    const taken = [...takenSet];
    const isToday = dateVal === todayKey();
    const now = new Date(); const nowMin = now.getHours() * 60 + now.getMinutes();
    slots.forEach(t => {
      const chip = document.createElement('div');
      const off = taken.includes(t) || (isToday && slotMinutes(t) <= nowMin);
      chip.className = 'chip' + (off ? ' off' : '');
      chip.textContent = t.replace(' ', ' ');
      if (!off) chip.onclick = () => { box.querySelectorAll('.chip').forEach(c => c.classList.remove('sel')); chip.classList.add('sel'); pickedTime = t; };
      if (keepTime === t && !off) { chip.classList.add('sel'); pickedTime = t; }
      box.appendChild(chip);
    });
  }
  function syncBlockUI() {
    const on = document.getElementById('fBlock').checked;
    ['fName', 'fPhone', 'fNotes'].forEach(id => { document.getElementById(id).disabled = on; });
  }
  function openModal(booking) {
    editingId = booking ? booking.id : null;
    document.getElementById('modalTitle').textContent = booking ? 'Edit booking' : 'Add booking';
    document.getElementById('formErr').textContent = '';
    const svc = document.getElementById('fService');
    svc.innerHTML = '';
    services.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s + (durations[s] ? ' · ' + durations[s] + ' min' : ''); svc.appendChild(o); });
    document.getElementById('fBlock').checked = booking ? !!booking.blockedSlot : false;
    document.getElementById('fName').value = booking && !booking.blockedSlot ? booking.name : '';
    document.getElementById('fPhone').value = booking ? (booking.phone || '') : '';
    document.getElementById('fNotes').value = booking ? (booking.notes || '') : '';
    if (booking) svc.value = booking.service;
    const dateEl = document.getElementById('fDate');
    dateEl.value = booking ? booking.date : selected;
    buildChips(dateEl.value, booking ? booking.time : null);
    syncBlockUI();
    document.getElementById('cancelRow').style.display = booking ? '' : 'none';
    overlay.classList.add('open');
  }
  function closeModal() { overlay.classList.remove('open'); }
  document.getElementById('fDate').addEventListener('change', e => buildChips(e.target.value, null));
  document.getElementById('fBlock').addEventListener('change', syncBlockUI);
  document.getElementById('addBtn').onclick = () => openModal(null);
  document.getElementById('closeBtn').onclick = closeModal;
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });

  document.getElementById('saveBtn').onclick = async () => {
    const blockTime = document.getElementById('fBlock').checked;
    const payload = {
      name: document.getElementById('fName').value.trim(),
      phone: document.getElementById('fPhone').value.trim(),
      notes: document.getElementById('fNotes').value.trim(),
      service: document.getElementById('fService').value,
      date: document.getElementById('fDate').value,
      time: pickedTime,
      blockTime,
    };
    const errEl = document.getElementById('formErr');
    if (!payload.date || !payload.time) { errEl.textContent = 'Please pick a date and a time.'; return; }
    if (!blockTime && !payload.name) { errEl.textContent = 'Customer name is required.'; return; }
    let r;
    if (editingId) {
      r = await fetch('/api/bookings/' + editingId, { method: 'PUT', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: JSON.stringify(payload) });
    } else {
      r = await fetch('/api/bookings', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: JSON.stringify(payload) });
    }
    const data = await r.json();
    if (!r.ok) { errEl.textContent = data.error || 'Could not save. Please try again.'; return; }
    selected = payload.date;
    const nd = new Date(selected + 'T12:00:00'); viewY = nd.getFullYear(); viewM = nd.getMonth();
    closeModal();
    loadAll();
  };

  document.getElementById('cancelBookingBtn').onclick = async () => {
    if (!editingId) return;
    const r = await fetch('/api/bookings/' + editingId, { method: 'DELETE', headers: { Authorization: 'Bearer ' + token } });
    if (r.ok) { closeModal(); loadAll(); }
    else document.getElementById('formErr').textContent = 'Cancel failed — please try again.';
  };

  document.getElementById('prevBtn').onclick = () => { viewM--; if (viewM < 0) { viewM = 11; viewY--; } renderCalendar(); };
  document.getElementById('nextBtn').onclick = () => { viewM++; if (viewM > 11) { viewM = 0; viewY++; } renderCalendar(); };
  function showDash() {
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('dashView').style.display = 'block';
    document.getElementById('logoutBtn').style.display = '';
    const t = new Date(); viewY = t.getFullYear(); viewM = t.getMonth(); selected = todayKey();
    loadAll();
  }
  document.getElementById('loginBtn').onclick = login;
  document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  document.getElementById('logoutBtn').onclick = logout;
  if (token) showDash();
</script>
</body>
</html>
